name: Build V13 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 不用 android-actions/setup-android：该 action 版本在 ubuntu-latest 上会挂。
      # 直接装 Google 官方 commandline-tools，再把 sdkmanager 放进 PATH。
      - name: Install Android SDK
        run: |
          set -e
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"
          curl -sSL -o cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q -o cmdline.zip
          rm -rf latest && mv cmdline-tools latest
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          mkdir -p "$ANDROID_HOME/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          sdkmanager --list_installed | head -20

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: |
          set -eo pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build-debug.log

      - name: Build Release APK
        run: |
          set -eo pipefail
          ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee build-release.log

      - name: Collect APKs
        run: |
          mkdir -p apk-out
          find app/build/outputs -name "*.apk" -type f -print > apk-list.txt || true
          echo "--- 找到的 APK ---"
          cat apk-list.txt
          while IFS= read -r f; do
            [ -n "$f" ] && cp "$f" apk-out/ || true
          done < apk-list.txt
          echo "--- apk-out ---"
          ls -lh apk-out
          if [ -z "$(ls -A apk-out)" ]; then
            echo "没有收集到任何 APK" >&2
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VioletBox-V13-apk
          path: apk-out/*.apk

      # 沙盒拿不到 Actions 日志（下载地址被网络策略拦住），失败时把日志提交到 ci-logs 分支便于排查。
      - name: Failure diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ci-logs
          cat build-debug.log build-release.log 2>/dev/null | tail -n 300 > ci-logs/build-log.txt || true
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -B ci-logs
          git add -f ci-logs || true
          git commit -m "CI 失败诊断日志 $(date -u +%Y%m%dT%H%M%SZ)" || true
          git push -f origin ci-logs || true

      # Release 附件与 Actions 制品的下载地址都会被网络策略拦住，
      # 因此把 APK 直接提交进仓库的 apk 孤儿分支（只放成品），之后用 contents API 原样读回。
      # 不发 Release —— V12 官方 Release 已经在仓库里，不覆盖。
      - name: Push APKs to apk branch
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout --orphan apk
          git rm -rf . --quiet || true
          mkdir -p apk
          cp apk-out/*.apk apk/ || true
          ls -lh apk
          git add -f apk
          git commit -m "VioletBox V13 APK $(date -u +%Y%m%dT%H%M%SZ)" || exit 1
          git push -f origin apk
